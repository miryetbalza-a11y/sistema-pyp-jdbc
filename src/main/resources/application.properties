spring.application.name=sistema-pyp-jdbc

# ========================================================
# Configuración de Conexión a Base de Datos MySQL (Sistema PyP)
# ========================================================
db.url=jdbc:mysql://localhost:3306/sistema_pyp?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
db.user=root
db.password=root
db.driver=com.mysql.cj.jdbc.Driver

# Configuración Spring Datasource (opcional para integración Spring)
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_pyp?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
